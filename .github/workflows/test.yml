name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
      - run: python -m compileall -q s3_expiry_witness.py
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m venv /tmp/s3-expiry-witness-installed
      - run: /tmp/s3-expiry-witness-installed/bin/python -m pip install --no-index --no-deps dist/*.whl
      - run: python test_installed_cli.py /tmp/s3-expiry-witness-installed/bin/python
